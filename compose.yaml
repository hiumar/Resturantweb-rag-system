services:
  api:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      FAQ_ADMIN_PASSWORD: ${FAQ_ADMIN_PASSWORD:?Set a production FAQ_ADMIN_PASSWORD}
      RESTAURANT_PHONE: ${RESTAURANT_PHONE:-}
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:3b}
    volumes:
      - ./db:/app/db
    depends_on:
      - ollama

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama_models:/root/.ollama

volumes:
  ollama_models:
